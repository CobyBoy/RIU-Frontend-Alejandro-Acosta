<mat-card class="h-full overflow-hidden">
  <div class="h-52 overflow-hidden aspect-4/5">
    <img
      class="h-52 w-full object-contain object-center"
      [src]="hero().imageUrl"
      [alt]="hero().name"
      loading="lazy"
    />
  </div>

  <mat-card-content class="space-y-1 pt-4">
    <h2 class="text-lg font-semibold">
      <a [href]="hero().link" target="_blank" rel="noopener">{{ hero().name }}</a>
    </h2>

    <p class="text-sm text-gray-600">
      {{ hero().realName }}
    </p>
  </mat-card-content>

  <mat-card-actions align="end">
    <button matButton type="button" (click)="onEdit()">Editar</button>

    <button matButton type="button" (click)="onDelete()">Borrar</button>
  </mat-card-actions>
</mat-card>
